<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170" width="1200" height="170" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace"><defs><filter id="gl" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="170" rx="18" fill="#080a1e" stroke="#1d2a5c"/><text x="600" y="50" font-size="19" fill="#d7e2ff" text-anchor="middle" font-style="italic">“A small step in code today can be a big step in your future.”<animate attributeName="opacity" values=".6;1;.6" dur="4s" repeatCount="indefinite"/></text><text x="600" y="76" font-size="13" fill="#ff6ad5" text-anchor="middle">— Keep Building 🚀</text><g><text x="90" y="136" font-size="36" text-anchor="middle">☕</text><animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="2.4s" repeatCount="indefinite"/></g><text x="150" y="125" font-size="13" fill="#5ef2ff">Caffeine</text><text x="150" y="147" font-size="15" font-weight="700" fill="#7dff9b">High</text><g><text x="390" y="136" font-size="36" text-anchor="middle">🎯</text><animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="2.8s" repeatCount="indefinite"/></g><text x="450" y="125" font-size="13" fill="#5ef2ff">Focus</text><text x="450" y="147" font-size="15" font-weight="700" fill="#7dff9b">Building</text><g><text x="690" y="136" font-size="36" text-anchor="middle">📘</text><animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="3.2s" repeatCount="indefinite"/></g><text x="750" y="125" font-size="13" fill="#5ef2ff">Learning</text><text x="750" y="147" font-size="15" font-weight="700" fill="#7dff9b">LLMs</text><g><text x="990" y="136" font-size="36" text-anchor="middle">🎮</text><animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="3.6s" repeatCount="indefinite"/></g><text x="1050" y="125" font-size="13" fill="#5ef2ff">Mood</text><text x="1050" y="147" font-size="15" font-weight="700" fill="#7dff9b">Productive</text></svg>